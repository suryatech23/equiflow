name: EquiFlow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Test EquiFlow Server Backend
      run: |
        cd server
        npm install

    - name: Build EquiFlow Frontend
      run: |
        cd frontend
        npm install
        npm run build